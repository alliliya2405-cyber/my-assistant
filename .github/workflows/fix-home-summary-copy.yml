name: Fix Home summary copy
on:
  push:
    branches: [home-dashboard-v1]
    paths: [.github/workflows/fix-home-summary-copy.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-dashboard-v1
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          old="const summary=today.length?`${today.length} ${today.length===1?'задача':'задачи'} на сегодня`:'На сегодня нет незавершённых задач';"
          new="const summary=today.length?`Задач на сегодня: ${today.length}`:'На сегодня нет незавершённых задач';"
          if s.count(old)!=1: raise SystemExit('summary line not found exactly once')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          node --check app.js
          git diff --check
      - run: |
          rm .github/workflows/fix-home-summary-copy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/fix-home-summary-copy.yml
          git commit -m "Polish Home dashboard summary copy"
          git push origin HEAD:home-dashboard-v1
