name: Safe persist patch

on:
  push:
    branches:
      - data-store-save-v1
    paths:
      - .github/workflows/safe-persist-patch.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-store-save-v1
          fetch-depth: 0
      - name: Patch exactly one persist call
        shell: python
        run: |
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = "function persist(message){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));"
          new = "function persist(message){try{MyAssistantDataStore.save(state);"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one persist target, found {count}; refusing to modify app.js')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate JavaScript syntax
        run: node --check app.js && node --check core/storage/data-store.js
      - name: Validate intended diff only
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "app.js"
          removed="$(git diff --unified=0 -- app.js | grep '^-' | grep -v '^---' || true)"
          added="$(git diff --unified=0 -- app.js | grep '^+' | grep -v '^+++' || true)"
          echo "$removed" | grep -F "function persist(message){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));"
          echo "$added" | grep -F "function persist(message){try{MyAssistantDataStore.save(state);"
          test "$(printf '%s\n' "$removed" | grep -c .)" -eq 1
          test "$(printf '%s\n' "$added" | grep -c .)" -eq 1
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/safe-persist-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/safe-persist-patch.yml
          git diff --cached --check
          git commit -m "Route persist through data store"
          git push origin HEAD:data-store-save-v1
