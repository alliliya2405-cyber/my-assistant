name: Apply Design System v1
on:
  push:
    branches:
      - design-system-v1
    paths:
      - .github/workflows/apply-design-system-v1.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design-system-v1
          fetch-depth: 0
      - name: Apply and validate
        run: bash .tmp/design-system-v1.sh
