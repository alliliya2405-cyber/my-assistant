name: Apply Home Dashboard v1
on:
  push:
    branches: [home-dashboard-v1]
    paths: [.github/workflows/apply-home-dashboard-v1.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home-dashboard-v1
          fetch-depth: 0
      - name: Apply patch
        run: python tools/apply_home_dashboard_v1.py
      - name: Validate
        run: |
          set -euo pipefail
          node --check app.js
          node --check core/storage/data-store.js
          node --check core/models/task.js
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' app.js index.html styles.css | sort)"
          test "$changed" = "$expected"
          grep -F '/* Home Dashboard v1 */' styles.css
          grep -F 'class="home-today-head"' app.js
          grep -F 'styles.css?v=19' index.html
          grep -F 'app.js?v=21' index.html
      - name: Commit
        run: |
          set -euo pipefail
          rm .github/workflows/apply-home-dashboard-v1.yml tools/apply_home_dashboard_v1.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css index.html .github/workflows/apply-home-dashboard-v1.yml tools/apply_home_dashboard_v1.py
          git diff --cached --check
          git commit -m "Implement Home Today dashboard v1"
          git push origin HEAD:home-dashboard-v1
