name: Apply Task Card Unified v1

on:
  push:
    branches:
      - task-card-unified-v1
    paths:
      - .github/workflows/apply-task-card-unified-v1.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task-card-unified-v1
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply_task_card_unified_v1.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check core/storage/data-store.js
          node --check core/models/task.js
          git diff --check
          grep -q 'Task Card Unified v1' styles.css
          grep -q 'styles.css?v=21' index.html
          test -z "$(git diff --name-only -- app.js core/storage/data-store.js core/models/task.js)"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' index.html styles.css | sort)"
          test "$changed" = "$expected"
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-task-card-unified-v1.yml scripts/apply_task_card_unified_v1.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css index.html .github/workflows/apply-task-card-unified-v1.yml scripts/apply_task_card_unified_v1.py
          git diff --cached --check
          git commit -m 'Unify task card collapse layout'
          git push origin HEAD:task-card-unified-v1
