name: Application UX Navigation Fix
on:
  push:
    branches: [application-ux-structure-v1]
    paths: [.github/workflows/app-ux-nav-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: application-ux-structure-v1
          fetch-depth: 0
      - name: Fix accordion state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.js')
          text=p.read_text(encoding='utf-8')
          old="const openSection=storedOpen||activeSection?.id||'planning';"
          new="const openSection=activeSection?.items?activeSection.id:(storedOpen||'planning');"
          if text.count(old)!=1: raise SystemExit(f'Expected one target, got {text.count(old)}')
          p.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate
        run: |
          node --check app.js
          git diff --check
          test "$(git diff --name-only)" = "app.js"
          grep -F "const openSection=activeSection?.items?activeSection.id:(storedOpen||'planning');" app.js
      - name: Commit
        run: |
          rm .github/workflows/app-ux-nav-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js .github/workflows/app-ux-nav-fix.yml
          git diff --cached --check
          git commit -m "Fix navigation accordion active section"
          git push origin HEAD:application-ux-structure-v1
